<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f2e9">
  <title>追光日历 · 我的追剧提醒</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f0e7;
      --paper-deep: #ebe4d7;
      --panel: #fffdf8;
      --panel-soft: #faf7f0;
      --ink: #202a27;
      --muted: #717a75;
      --faint: #9aa19d;
      --line: rgba(32, 42, 39, 0.11);
      --line-strong: rgba(32, 42, 39, 0.19);
      --accent: #ee735a;
      --accent-deep: #ce5943;
      --accent-soft: #fce4dc;
      --sage: #5f8b76;
      --sage-soft: #deebe4;
      --gold: #dfad43;
      --danger: #c5524e;
      --shadow: 0 18px 46px rgba(62, 52, 36, 0.09);
      --shadow-sm: 0 8px 22px rgba(62, 52, 36, 0.07);
      --radius: 24px;
      --radius-sm: 16px;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --paper: #121716;
      --paper-deep: #181f1d;
      --panel: #1d2522;
      --panel-soft: #222b28;
      --ink: #f0ede5;
      --muted: #a5aea9;
      --faint: #7e8883;
      --line: rgba(240, 237, 229, 0.11);
      --line-strong: rgba(240, 237, 229, 0.2);
      --accent: #f08268;
      --accent-deep: #ff9b83;
      --accent-soft: #3b2925;
      --sage: #83ad98;
      --sage-soft: #24362f;
      --gold: #e5bd61;
      --danger: #ef8d88;
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.25);
      --shadow-sm: 0 8px 24px rgba(0, 0, 0, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 8% 0%, rgba(238, 115, 90, 0.13), transparent 28rem),
        radial-gradient(circle at 94% 14%, rgba(95, 139, 118, 0.12), transparent 25rem),
        var(--paper);
      color: var(--ink);
      font-family: "Avenir Next", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button,
    [role="button"] {
      -webkit-tap-highlight-color: transparent;
    }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent);
      outline-offset: 2px;
    }

    .app {
      width: min(1380px, calc(100% - 40px));
      margin: 0 auto;
      padding: 22px 0 52px;
    }

    .topbar {
      min-height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-width: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 15px 15px 15px 5px;
      color: #fff9f5;
      background: linear-gradient(145deg, var(--accent), var(--accent-deep));
      box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 28%, transparent);
    }

    .brand-mark svg {
      width: 23px;
      height: 23px;
    }

    .brand-copy {
      line-height: 1.15;
    }

    .brand-name {
      margin: 0;
      font-family: "Songti SC", "STSong", Georgia, serif;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .brand-tag {
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.16em;
    }

    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 9px;
      flex-wrap: wrap;
    }

    .btn {
      min-height: 42px;
      border: 1px solid transparent;
      border-radius: 13px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      transition: transform 160ms ease, background 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .btn svg {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-primary {
      color: #fffaf7;
      background: var(--accent);
      box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 24%, transparent);
    }

    .btn-primary:hover {
      background: var(--accent-deep);
      box-shadow: 0 10px 24px color-mix(in srgb, var(--accent) 30%, transparent);
    }

    .btn-secondary {
      color: var(--ink);
      background: color-mix(in srgb, var(--panel) 82%, transparent);
      border-color: var(--line);
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(12px);
    }

    .btn-secondary:hover {
      border-color: var(--line-strong);
      background: var(--panel);
    }

    .btn-ghost {
      min-height: 38px;
      padding: 0 12px;
      color: var(--muted);
      background: transparent;
      border-color: var(--line);
    }

    .btn-ghost:hover {
      color: var(--ink);
      background: var(--panel-soft);
    }

    .btn-icon {
      width: 42px;
      padding: 0;
    }

    .btn[aria-pressed="true"] {
      color: var(--sage);
      border-color: color-mix(in srgb, var(--sage) 35%, var(--line));
      background: var(--sage-soft);
    }

    .hero {
      position: relative;
      isolation: isolate;
      margin-top: 18px;
      min-height: 230px;
      border-radius: 30px;
      overflow: hidden;
      padding: clamp(25px, 4vw, 46px);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 30px;
      background:
        linear-gradient(125deg, color-mix(in srgb, var(--panel) 94%, transparent), color-mix(in srgb, var(--accent-soft) 75%, var(--panel)));
      border: 1px solid color-mix(in srgb, var(--accent) 15%, var(--line));
      box-shadow: var(--shadow);
    }

    .hero::before,
    .hero::after {
      content: "";
      position: absolute;
      z-index: -1;
      border-radius: 999px;
      filter: blur(1px);
    }

    .hero::before {
      width: 360px;
      height: 360px;
      right: -70px;
      top: -170px;
      background: color-mix(in srgb, var(--accent) 17%, transparent);
    }

    .hero::after {
      width: 280px;
      height: 280px;
      right: 240px;
      bottom: -210px;
      background: color-mix(in srgb, var(--sage) 18%, transparent);
    }

    .hero-copy {
      max-width: 680px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--accent-deep);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 22px;
      height: 2px;
      border-radius: 2px;
      background: currentColor;
    }

    .hero h1 {
      margin: 12px 0 10px;
      font-family: "Songti SC", "STSong", Georgia, serif;
      font-size: clamp(34px, 5vw, 62px);
      line-height: 1.12;
      font-weight: 700;
      letter-spacing: -0.045em;
    }

    .hero h1 em {
      color: var(--accent);
      font-style: normal;
    }

    .hero-line {
      display: inline;
    }

    .hero-subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.75;
    }

    .hero-summary {
      flex: 0 0 auto;
      width: min(310px, 100%);
      min-width: 0;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .summary-item {
      min-width: 0;
      min-height: 92px;
      padding: 15px 12px;
      border-radius: 19px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: color-mix(in srgb, var(--panel) 78%, transparent);
      border: 1px solid var(--line);
      backdrop-filter: blur(16px);
    }

    .summary-item strong {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 30px;
      line-height: 1;
      font-weight: 500;
      letter-spacing: -0.04em;
    }

    .summary-item span {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .dashboard {
      display: grid;
      grid-template-columns: minmax(0, 1.72fr) minmax(310px, 0.78fr);
      gap: 18px;
      align-items: start;
      margin-top: 18px;
    }

    .dashboard > * {
      min-width: 0;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--panel) 96%, transparent);
      box-shadow: var(--shadow-sm);
    }

    .calendar-panel {
      min-width: 0;
      padding: clamp(16px, 2.3vw, 27px);
    }

    .panel-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    .month-control {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .month-title {
      min-width: 142px;
      margin: 0;
      font-family: "Songti SC", "STSong", Georgia, serif;
      font-size: clamp(24px, 2.5vw, 30px);
      line-height: 1.1;
      letter-spacing: -0.035em;
      white-space: nowrap;
    }

    .month-title small {
      color: var(--muted);
      font-family: "Avenir Next", "PingFang SC", sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0;
      margin-left: 7px;
    }

    .month-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .round-btn {
      width: 34px;
      height: 34px;
      padding: 0;
      display: grid;
      place-items: center;
      border-radius: 10px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }

    .round-btn:hover {
      color: var(--ink);
      border-color: var(--line-strong);
      background: var(--panel-soft);
    }

    .round-btn svg {
      width: 17px;
      height: 17px;
    }

    .today-btn {
      width: auto;
      padding: 0 12px;
      font-size: 12px;
      font-weight: 600;
    }

    .calendar {
      width: 100%;
    }

    .weekdays,
    .days {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
    }

    .weekdays {
      margin-bottom: 7px;
    }

    .weekday {
      padding: 5px 4px 9px;
      color: var(--faint);
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    .weekday:nth-last-child(-n + 2) {
      color: var(--accent);
    }

    .days {
      gap: 5px;
    }

    .day {
      position: relative;
      min-width: 0;
      min-height: 91px;
      padding: 8px;
      border: 1px solid transparent;
      border-radius: 13px;
      color: var(--ink);
      background: transparent;
      text-align: left;
      cursor: pointer;
      transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
    }

    .day:hover {
      border-color: var(--line);
      background: var(--panel-soft);
    }

    .day.is-outside {
      color: var(--faint);
      opacity: 0.52;
    }

    .day.is-weekend:not(.is-outside) .day-number {
      color: var(--accent-deep);
    }

    .day.is-today {
      border-color: color-mix(in srgb, var(--accent) 38%, var(--line));
      background: color-mix(in srgb, var(--accent-soft) 38%, transparent);
    }

    .day.is-selected {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent-soft) 78%, var(--panel));
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 20%, transparent);
    }

    .day-number {
      display: inline-grid;
      width: 24px;
      height: 24px;
      place-items: center;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
    }

    .day.is-today .day-number {
      color: #fffaf7;
      background: var(--accent);
    }

    .episode-chips {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 7px;
    }

    .episode-chip {
      width: 100%;
      min-width: 0;
      padding: 3px 5px;
      display: flex;
      align-items: center;
      gap: 4px;
      border-radius: 5px;
      color: color-mix(in srgb, var(--show-color) 68%, var(--ink));
      background: color-mix(in srgb, var(--show-color) 16%, transparent);
      font-size: 9px;
      font-weight: 600;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .episode-chip::before {
      content: "";
      width: 4px;
      height: 4px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--show-color);
    }

    .more-chip {
      color: var(--muted);
      background: transparent;
      font-weight: 500;
    }

    .mobile-dots {
      display: none;
      gap: 3px;
      margin-top: 8px;
    }

    .mobile-dot {
      width: 5px;
      height: 5px;
      border-radius: 999px;
      background: var(--show-color);
    }

    .side-column {
      display: grid;
      gap: 18px;
    }

    .agenda-panel {
      min-width: 0;
      padding: 22px;
    }

    .agenda-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .agenda-date {
      margin: 0;
      font-family: "Songti SC", "STSong", Georgia, serif;
      font-size: 23px;
      line-height: 1.2;
    }

    .agenda-subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .subtle-action {
      padding: 5px 0;
      border: 0;
      color: var(--accent-deep);
      background: transparent;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .agenda-list {
      display: grid;
      gap: 10px;
    }

    .agenda-item {
      position: relative;
      padding: 14px 12px 14px 15px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      border-radius: 14px;
      background: var(--panel-soft);
      overflow: hidden;
    }

    .agenda-item::before {
      content: "";
      position: absolute;
      inset: 10px auto 10px 0;
      width: 3px;
      border-radius: 0 4px 4px 0;
      background: var(--show-color);
    }

    .agenda-main {
      min-width: 0;
    }

    .agenda-time {
      color: var(--accent-deep);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .agenda-show {
      margin-top: 4px;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .agenda-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.4;
    }

    .watch-btn {
      width: 32px;
      height: 32px;
      padding: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid var(--line-strong);
      color: var(--faint);
      background: var(--panel);
      cursor: pointer;
    }

    .watch-btn:hover {
      color: var(--sage);
      border-color: var(--sage);
    }

    .watch-btn.is-watched {
      color: #fff;
      border-color: var(--sage);
      background: var(--sage);
    }

    .watch-btn svg {
      width: 15px;
      height: 15px;
    }

    .agenda-item.is-watched .agenda-show {
      color: var(--muted);
      text-decoration: line-through;
      text-decoration-thickness: 1px;
    }

    .empty {
      padding: 28px 16px;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
      line-height: 1.8;
      border: 1px dashed var(--line-strong);
      border-radius: 14px;
    }

    .empty strong {
      display: block;
      margin-bottom: 4px;
      color: var(--ink);
      font-family: "Songti SC", "STSong", Georgia, serif;
      font-size: 16px;
    }

    .next-panel {
      min-width: 0;
      padding: 20px 22px 22px;
    }

    .mini-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 13px;
    }

    .mini-heading h3 {
      margin: 0;
      font-size: 13px;
      font-weight: 700;
    }

    .mini-heading span {
      color: var(--faint);
      font-size: 10px;
    }

    .next-list {
      display: grid;
      gap: 11px;
    }

    .next-row {
      display: grid;
      grid-template-columns: 39px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
    }

    .next-date {
      width: 39px;
      height: 43px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
    }

    .next-date strong {
      font-family: Georgia, serif;
      font-size: 17px;
      line-height: 1;
      font-weight: 500;
    }

    .next-date span {
      margin-top: 3px;
      color: var(--muted);
      font-size: 9px;
    }

    .next-copy {
      min-width: 0;
    }

    .next-title {
      font-size: 12px;
      font-weight: 600;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .next-meta {
      margin-top: 3px;
      color: var(--muted);
      font-size: 9px;
    }

    .next-time {
      color: var(--muted);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }

    .library {
      margin-top: 34px;
      scroll-margin-top: 20px;
    }

    .section-heading {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 17px;
    }

    .section-heading h2 {
      margin: 0;
      font-family: "Songti SC", "STSong", Georgia, serif;
      font-size: clamp(25px, 3vw, 34px);
      letter-spacing: -0.035em;
    }

    .section-heading p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .show-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .show-card {
      position: relative;
      min-width: 0;
      padding: 14px;
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr);
      gap: 13px;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: var(--panel);
      box-shadow: var(--shadow-sm);
      transition: transform 160ms ease, border-color 160ms ease;
    }

    .show-card:hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--show-color) 35%, var(--line));
    }

    .show-cover {
      position: relative;
      width: 72px;
      aspect-ratio: 3 / 4;
      overflow: hidden;
      display: grid;
      place-items: center;
      border-radius: 13px;
      color: #fff;
      background:
        radial-gradient(circle at 28% 20%, rgba(255, 255, 255, 0.32), transparent 30%),
        linear-gradient(145deg, color-mix(in srgb, var(--show-color) 82%, #fff), color-mix(in srgb, var(--show-color) 76%, #18221f));
      box-shadow: 0 8px 14px color-mix(in srgb, var(--show-color) 20%, transparent);
    }

    .show-cover::after {
      content: "";
      position: absolute;
      width: 48px;
      height: 48px;
      right: -17px;
      bottom: -17px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
    }

    .show-cover span {
      font-family: "Songti SC", "STSong", Georgia, serif;
      font-size: 30px;
      font-weight: 700;
    }

    .show-info {
      min-width: 0;
      padding: 2px 0;
      display: flex;
      flex-direction: column;
    }

    .show-topline {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .platform-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--show-color);
    }

    .platform {
      min-width: 0;
      color: var(--muted);
      font-size: 9px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .show-title {
      margin: 7px 0 0;
      font-family: "Songti SC", "STSong", Georgia, serif;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .show-schedule {
      margin-top: 5px;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.55;
    }

    .show-progress {
      margin-top: auto;
      padding-top: 10px;
    }

    .progress-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
      color: var(--muted);
      font-size: 9px;
    }

    .progress-track {
      height: 4px;
      overflow: hidden;
      border-radius: 99px;
      background: var(--line);
    }

    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: var(--show-color);
      transition: width 300ms ease;
    }

    .edit-show {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      opacity: 0;
      cursor: pointer;
      transition: opacity 150ms ease, background 150ms ease;
    }

    .show-card:hover .edit-show,
    .edit-show:focus-visible {
      opacity: 1;
    }

    .edit-show:hover {
      color: var(--ink);
      background: var(--panel-soft);
    }

    .edit-show svg {
      width: 14px;
      height: 14px;
    }

    .add-card {
      min-height: 150px;
      border: 1px dashed var(--line-strong);
      border-radius: 19px;
      color: var(--muted);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: color 150ms ease, border-color 150ms ease, background 150ms ease;
    }

    .add-card:hover {
      color: var(--accent-deep);
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent-soft) 28%, transparent);
    }

    .add-card svg {
      width: 18px;
      height: 18px;
    }

    .app-footer {
      margin-top: 34px;
      padding-top: 19px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 18px;
      color: var(--faint);
      font-size: 10px;
      line-height: 1.7;
    }

    .app-footer p {
      margin: 0;
    }

    dialog {
      width: min(560px, calc(100% - 28px));
      max-height: calc(100dvh - 36px);
      padding: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 25px;
      color: var(--ink);
      background: var(--panel);
      box-shadow: 0 34px 100px rgba(0, 0, 0, 0.28);
    }

    dialog::backdrop {
      background: rgba(16, 22, 20, 0.54);
      backdrop-filter: blur(4px);
    }

    .dialog-head {
      padding: 22px 24px 17px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--line);
    }

    .dialog-head h2 {
      margin: 0;
      font-family: "Songti SC", "STSong", Georgia, serif;
      font-size: 24px;
    }

    .dialog-head p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 11px;
    }

    .dialog-close {
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }

    .dialog-close:hover {
      color: var(--ink);
      background: var(--panel-soft);
    }

    .dialog-close svg {
      width: 16px;
      height: 16px;
    }

    .show-form {
      padding: 19px 24px 0;
      overflow-y: auto;
      max-height: calc(100dvh - 210px);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .field {
      min-width: 0;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label,
    .field-label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }

    .field input {
      width: 100%;
      min-height: 43px;
      padding: 0 12px;
      border: 1px solid var(--line-strong);
      border-radius: 11px;
      color: var(--ink);
      background: var(--panel-soft);
      font-size: 14px;
    }

    .field input:hover {
      border-color: color-mix(in srgb, var(--ink) 25%, var(--line));
    }

    .weekday-picker {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .weekday-check {
      position: relative;
    }

    .weekday-check input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .weekday-check span {
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--muted);
      background: var(--panel-soft);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .weekday-check input:checked + span {
      color: #fff;
      border-color: var(--accent);
      background: var(--accent);
    }

    .weekday-check input:focus-visible + span {
      outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent);
      outline-offset: 2px;
    }

    .color-picker {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
    }

    .color-check {
      position: relative;
    }

    .color-check input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .color-check span {
      width: 30px;
      height: 30px;
      display: block;
      border: 3px solid var(--panel);
      border-radius: 50%;
      background: var(--swatch);
      box-shadow: 0 0 0 1px var(--line);
      cursor: pointer;
    }

    .color-check input:checked + span {
      box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--swatch);
    }

    .color-check input:focus-visible + span {
      outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent);
      outline-offset: 5px;
    }

    .form-error {
      min-height: 18px;
      margin: 13px 0 0;
      color: var(--danger);
      font-size: 11px;
    }

    .dialog-actions {
      padding: 15px 24px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .dialog-actions-right {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-left: auto;
    }

    .delete-btn {
      padding: 6px 0;
      border: 0;
      color: var(--danger);
      background: transparent;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .delete-btn:hover {
      text-decoration: underline;
    }

    .toast-region {
      position: fixed;
      z-index: 100;
      right: 24px;
      bottom: 24px;
      display: grid;
      gap: 9px;
      pointer-events: none;
    }

    .toast {
      max-width: min(360px, calc(100vw - 32px));
      padding: 13px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 13px;
      color: var(--ink);
      background: var(--panel);
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.18);
      font-size: 12px;
      line-height: 1.5;
      animation: toast-in 220ms ease-out;
    }

    .toast::before {
      content: "";
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--accent);
    }

    @keyframes toast-in {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
    }

    @media (max-width: 1120px) {
      .show-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .day {
        min-height: 84px;
      }
    }

    @media (max-width: 900px) {
      .hero {
        align-items: flex-start;
        flex-direction: column;
      }

      .hero-summary {
        width: min(480px, 100%);
      }

      .dashboard {
        grid-template-columns: 1fr;
      }

      .side-column {
        grid-template-columns: 1fr 1fr;
      }

      .show-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 680px) {
      .app {
        width: min(100% - 24px, 640px);
        padding-top: 12px;
        padding-bottom: 32px;
      }

      .topbar {
        align-items: flex-start;
      }

      .brand-tag {
        display: none;
      }

      .brand-mark {
        width: 38px;
        height: 38px;
        border-radius: 13px 13px 13px 4px;
      }

      .top-actions {
        gap: 7px;
      }

      .top-actions .desktop-label {
        display: none;
      }

      .top-actions .btn {
        width: 39px;
        min-height: 39px;
        padding: 0;
      }

      .top-actions .btn-primary {
        width: 39px;
        padding: 0;
      }

      .top-actions .btn-primary span {
        display: none;
      }

      .hero {
        margin-top: 11px;
        min-height: 0;
        padding: 25px 21px 21px;
        border-radius: 23px;
        gap: 23px;
      }

      .hero h1 {
        font-size: 38px;
      }

      .hero-line {
        display: block;
      }

      .hero-subtitle {
        font-size: 12px;
      }

      .hero-summary {
        width: 100%;
        gap: 7px;
      }

      .summary-item {
        min-height: 74px;
        padding: 11px 10px;
        border-radius: 14px;
      }

      .summary-item strong {
        font-size: 24px;
      }

      .summary-item span {
        font-size: 9px;
      }

      .dashboard {
        margin-top: 11px;
        gap: 11px;
      }

      .calendar-panel {
        padding: 15px 9px 12px;
        border-radius: 20px;
      }

      .panel-heading {
        padding: 0 6px;
        margin-bottom: 10px;
      }

      .month-title {
        min-width: 0;
        font-size: 24px;
      }

      .month-title small {
        display: none;
      }

      .month-control {
        gap: 4px;
      }

      .month-actions {
        gap: 4px;
      }

      .round-btn {
        width: 30px;
        height: 30px;
      }

      .today-btn {
        width: auto;
        padding: 0 9px;
        font-size: 10px;
      }

      .weekday {
        padding: 4px 2px 6px;
        font-size: 10px;
      }

      .days {
        gap: 2px;
      }

      .day {
        min-height: 62px;
        padding: 5px;
        border-radius: 9px;
      }

      .day-number {
        width: 20px;
        height: 20px;
        font-size: 10px;
      }

      .episode-chips {
        display: none;
      }

      .mobile-dots {
        display: flex;
        flex-wrap: wrap;
      }

      .side-column {
        grid-template-columns: 1fr;
        gap: 11px;
      }

      .agenda-panel,
      .next-panel {
        padding: 18px;
        border-radius: 20px;
      }

      .library {
        margin-top: 28px;
      }

      .section-heading {
        align-items: center;
      }

      .section-heading .btn {
        width: 38px;
        min-height: 38px;
        padding: 0;
      }

      .section-heading .btn span {
        display: none;
      }

      .show-grid {
        grid-template-columns: 1fr;
        gap: 9px;
      }

      .show-card {
        grid-template-columns: 66px minmax(0, 1fr);
        min-height: 110px;
        padding: 12px;
      }

      .show-cover {
        width: 66px;
      }

      .add-card {
        min-height: 74px;
      }

      .edit-show {
        opacity: 1;
      }

      .app-footer {
        align-items: flex-start;
        flex-direction: column;
        gap: 6px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .dialog-head,
      .show-form,
      .dialog-actions {
        padding-left: 18px;
        padding-right: 18px;
      }

      .toast-region {
        right: 16px;
        bottom: 16px;
        left: 16px;
      }

      .toast {
        max-width: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <symbol id="icon-clapper" viewBox="0 0 24 24">

      <path d="m8 4 2 4m4-4 2 4" fill="none" stroke="currentColor" stroke-width="1.8"/>
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-bell" viewBox="0 0 24 24">
      <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

      <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24">
      <path d="M20 15.4A8 8 0 0 1 8.6 4 8.5 8.5 0 1 0 20 15.4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>

    <symbol id="icon-left" viewBox="0 0 24 24">
      <path d="m15 18-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-right" viewBox="0 0 24 24">
      <path d="m9 18 6-6-6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">

    </symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24">
      <path d="m14 5 5 5M4 20l4.5-1L19 8.5a2.1 2.1 0 0 0-3-3L5.5 16 4 20Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

      <path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>

  </svg>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg><use href="#icon-clapper"></use></svg>
        </div>
        <div class="brand-copy">
          <p class="brand-name">追光日历</p>
          <div class="brand-tag">ONE STORY AT A TIME</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="btn btn-secondary" id="exportBtn" type="button" aria-label="导出日历">
          <svg aria-hidden="true"><use href="#icon-calendar"></use></svg>
          <span class="desktop-label">导出日历</span>
        </button>
        <button class="btn btn-secondary" id="reminderBtn" type="button" aria-pressed="false" aria-label="开启提醒">
          <svg aria-hidden="true"><use href="#icon-bell"></use></svg>
          <span class="desktop-label" id="reminderLabel">开启提醒</span>
        </button>
        <button class="btn btn-icon btn-secondary" id="themeBtn" type="button" aria-label="切换深色模式">
          <svg aria-hidden="true"><use id="themeIcon" href="#icon-moon"></use></svg>
        </button>
        <button class="btn btn-primary" id="addShowTop" type="button">
          <svg aria-hidden="true"><use href="#icon-plus"></use></svg>
          <span>添加剧集</span>
        </button>
      </div>
    </header>

    <main>
      <section class="hero" aria-labelledby="heroTitle">
        <div class="hero-copy">
          <div class="eyebrow" id="todayEyebrow"></div>
          <h1 id="heroTitle"><span class="hero-line">今晚，留给</span><em>好故事</em>。</h1>
          <p class="hero-subtitle" id="heroSubtitle"></p>
        </div>
        <div class="hero-summary" aria-label="追剧摘要">
          <div class="summary-item">
            <strong id="showCount">0</strong>
            <span>正在追的剧</span>
          </div>
          <div class="summary-item">
            <strong id="weekCount">0</strong>
            <span>本周将更新</span>
          </div>
          <div class="summary-item">
            <strong id="watchedPercent">0%</strong>
            <span>观看进度</span>
          </div>
        </div>
      </section>

      <div class="dashboard">
        <section class="panel calendar-panel" aria-labelledby="monthTitle">
          <div class="panel-heading">
            <div class="month-control">
              <h2 class="month-title" id="monthTitle"></h2>
              <div class="month-actions">
                <button class="round-btn" id="prevMonth" type="button" aria-label="上个月">
                  <svg aria-hidden="true"><use href="#icon-left"></use></svg>
                </button>
                <button class="round-btn" id="nextMonth" type="button" aria-label="下个月">
                  <svg aria-hidden="true"><use href="#icon-right"></use></svg>
                </button>
              </div>
            </div>
            <button class="round-btn today-btn" id="todayBtn" type="button">回到今天</button>
          </div>
          <div class="calendar">
            <div class="weekdays" aria-hidden="true">
              <div class="weekday">一</div>
              <div class="weekday">二</div>
              <div class="weekday">三</div>
              <div class="weekday">四</div>
              <div class="weekday">五</div>
              <div class="weekday">六</div>
              <div class="weekday">日</div>
            </div>
            <div class="days" id="calendarGrid" role="grid" aria-label="追剧月历"></div>
          </div>
        </section>

        <aside class="side-column" aria-label="更新详情">
          <section class="panel agenda-panel" aria-labelledby="agendaTitle">
            <div class="agenda-heading">
              <div>
                <h2 class="agenda-date" id="agendaTitle"></h2>
                <p class="agenda-subtitle" id="agendaSubtitle"></p>
              </div>
              <button class="subtle-action" id="watchAllBtn" type="button">全部已看</button>
            </div>
            <div class="agenda-list" id="agendaList" aria-live="polite"></div>
          </section>

          <section class="panel next-panel" aria-labelledby="nextTitle">
            <div class="mini-heading">
              <h3 id="nextTitle">接下来</h3>
              <span>未来 3 次更新</span>
            </div>
            <div class="next-list" id="nextList"></div>
          </section>
        </aside>
      </div>

      <section class="library" id="library" aria-labelledby="libraryTitle">
        <div class="section-heading">
          <div>
            <h2 id="libraryTitle">我的片单</h2>
            <p>设置首播日和更新规律，之后交给日历。</p>
          </div>
          <button class="btn btn-secondary" id="addShowBottom" type="button">
            <svg aria-hidden="true"><use href="#icon-plus"></use></svg>
            <span>添加剧集</span>
          </button>
        </div>
        <div class="show-grid" id="showGrid"></div>
      </section>
    </main>

    <footer class="app-footer">
      <p>数据仅保存在当前浏览器。开启提醒后，请保持本页面打开。</p>
      <p>想获得系统级提醒，可导出日历后导入手机或电脑日历。</p>
    </footer>
  </div>

  <dialog id="showDialog" aria-labelledby="dialogTitle">
    <div class="dialog-head">
      <div>
        <h2 id="dialogTitle">添加一部剧</h2>
        <p>只需设置一次，更新集数会自动排进日历。</p>
      </div>
      <button class="dialog-close" id="closeDialog" type="button" aria-label="关闭">
        <svg aria-hidden="true"><use href="#icon-close"></use></svg>
      </button>
    </div>
    <form class="show-form" id="showForm" novalidate>
      <div class="form-grid">
        <div class="field full">
          <label for="showTitleInput">剧名</label>
          <input id="showTitleInput" name="title" maxlength="30" placeholder="例如：漫长的季节" autocomplete="off" required>
        </div>
        <div class="field">
          <label for="platformInput">播出平台</label>
          <input id="platformInput" name="platform" maxlength="20" placeholder="例如：腾讯视频" autocomplete="off">
        </div>
        <div class="field">
          <label for="timeInput">更新时间</label>
          <input id="timeInput" name="time" type="time" value="20:00" required>
        </div>
        <div class="field">
          <label for="premiereInput">首播日期</label>
          <input id="premiereInput" name="premiere" type="date" required>
        </div>
        <div class="field">
          <label for="totalInput">总集数</label>
          <input id="totalInput" name="total" type="number" min="1" max="200" value="12" required>
        </div>
        <div class="field full">
          <span class="field-label">每周更新日</span>
          <div class="weekday-picker" id="weekdayPicker">
            <label class="weekday-check"><input type="checkbox" name="days" value="1"><span>一</span></label>

  <script>
    (() => {
      "use strict";

      const STORAGE_KEY = "zhuiguang-calendar-v1";
      const DATA_VERSION = 4;
      const FEATURED_SHOW_IDS = ["show-after-meet", "show-fool-in-love"];
      const THEME_KEY = "zhuiguang-theme";
      const DAY_NAMES = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
      const MONTH_NAMES = ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"];
      const COLORS = ["#ee735a", "#5f8b76", "#dfad43", "#5d83be", "#a473b0", "#cc6b83"];
      const reminderSent = new Set();
      let toastTimer = 0;

      const pad = (value) => String(value).padStart(2, "0");
      const dateKey = (date) => `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
      const parseDate = (key) => new Date(`${key}T00:00:00`);
      const startOfDay = (date) => new Date(date.getFullYear(), date.getMonth(), date.getDate());
      const addDays = (date, amount) => new Date(date.getFullYear(), date.getMonth(), date.getDate() + amount);
      const startOfWeek = (date) => {
        const result = startOfDay(date);
        const offset = (result.getDay() + 6) % 7;
        result.setDate(result.getDate() - offset);
        return result;
      };
      const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));

      function makeAfterMeetEpisodes() {
        const episodes = [
          { date: "2026-10-22", label: "第1期", accessLabel: "正片" },
          { date: "2026-10-22", label: "第2期", accessLabel: "正片" },
          { date: "2026-10-29", label: "第3期（上）", accessLabel: "正片" },
          { date: "2026-10-29", label: "第3期（下）", accessLabel: "正片" }
        ];
        let issue = 4;
        let cursor = parseDate("2026-11-05");
        const end = parseDate("2026-12-31");
        while (cursor <= end) {
          const key = dateKey(cursor);
          episodes.push({ date: key, label: `第${issue}期（上）`, accessLabel: "正片" });
          episodes.push({ date: key, label: `第${issue}期（下）`, accessLabel: "正片 · SVIP可抢先看下集" });
          issue += 1;
          cursor = addDays(cursor, 7);
        }

        let extraIssue = 1;
        let extraDate = parseDate("2026-10-23");
        while (extraDate <= end) {
          const key = dateKey(extraDate);
          episodes.push({
            date: key,
            label: `加更版第${extraIssue}期`,
            accessLabel: "VIP会员加更",
            platform: "芒果TV · VIP"
          });
          episodes.push({
            date: key,
            label: `抢鲜/云陪看第${extraIssue}期`,
            accessLabel: "VIP / SVIP抢先内容",
            platform: "芒果TV · 会员"
          });
          extraIssue += 1;
          extraDate = addDays(extraDate, 7);
        }

        [
          ["2026-10-17", "周笔畅友情问答", "花絮"],
          ["2026-10-17", "喻丰友情问答", "花絮"],
          ["2026-10-17", "黄婷婷友情问答", "花絮"],
          ["2026-10-17", "苏醒友情问答", "花絮"],
          ["2026-10-17", "张泉灵&李维嘉友情问答", "花絮"],
          ["2026-10-17", "观察室友情问答", "花絮"],
          ["2026-10-20", "回忆档案：马天宇谈社交影响工作", "花絮"],
          ["2026-10-20", "回忆档案：厉娜想对许飞说的话", "花絮"],
          ["2026-10-20", "回忆档案：厉娜许飞外景采访", "花絮"],
          ["2026-10-20", "回忆档案：厉娜投票支持许飞", "花絮"],
          ["2026-10-20", "回忆档案：厉娜许飞拉票进行时", "花絮"],
          ["2026-10-20", "回忆档案：许飞揭晓厉娜得票", "花絮"],
          ["2026-10-23", "加友站第1期：厉娜马天宇相互爆料", "VIP会员花絮"],
          ["2026-10-23", "加友站第2期：厉娜开局爆怼许飞", "VIP会员花絮"],
          ["2026-10-23", "超长花絮：许飞坦言对友谊持悲观态度", "花絮"],
          ["2026-10-27", "独家高光花絮第1期：黄婷婷的女团高压友情课", "VIP会员花絮"],
          ["2026-10-30", "加友站第3期：青稚白小纯一条龙服务", "花絮"],
          ["2026-10-30", "加友站第4期：马天宇在线求秋裤", "花絮"],
          ["2026-11-02", "超长花絮：厉娜感慨遗憾与失落", "花絮"],
          ["2026-11-02", "独家高光花絮第2期：青稚白小纯初见面", "VIP会员花絮"],
          ["2026-11-03", "超长花絮：青稚白小纯热血奔跑", "花絮"],
          ["2026-11-05", "下期看点：旧友真心话大冒险", "下期看点"]
        ].forEach(([date, label, accessLabel]) => {
          episodes.push({
            date,
            label,
            accessLabel,
            platform: accessLabel.includes("VIP") ? "芒果TV · VIP" : "芒果TV"
          });
        });
        return episodes;
      }

      function featuredShows() {
        const afterMeetEpisodes = makeAfterMeetEpisodes();
        return [
          {
            id: "show-after-meet",
            title: "后会友期",
            platform: "芒果TV",
            premiere: "2026-10-22",
            days: [4],
            time: "12:00",
            total: afterMeetEpisodes.length,
            color: "#dfad43",
            fixedEpisodes: afterMeetEpisodes,
            scheduleNote: "周四正片双更 · 周五 VIP 加更/抢鲜 · 已排至 12月31日",
            sourceUrl: "https://www.mgtv.com/h/914227.html",
            sourceLabel: "芒果TV官方页面"
          },
          {
            id: "show-fool-in-love",
            title: "Fool in Love",
            platform: "iQIYI",
            premiere: "2026-10-08",
            days: [4, 0],
            time: "21:00",
            total: 20,
            color: "#5d83be",
            scheduleNote: "周四、周日 21:00 · 共 20 集",
            sourceUrl: "https://blglhub.com/zh/series/fool-in-love/",
            sourceLabel: "官方排播核对页"
          }
        ];
      }

      const today = startOfDay(new Date());

      function airedEpisodeKeys(shows) {
        const todayKey = dateKey(today);
        return shows
          .flatMap(buildSchedule)
          .filter((episode) => episode.date <= todayKey)
          .map((episode) => episode.key);
      }

      function initialState() {
        const shows = featuredShows();
        return {
          version: DATA_VERSION,
          shows,
          watched: airedEpisodeKeys(shows),
          reminders: false
        };
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            const state = initialState();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            return state;
          }
          const parsed = JSON.parse(raw);
          const storedVersion = Number(parsed.version) || 0;
          let shows = Array.isArray(parsed.shows) ? parsed.shows : [];
          let watched = Array.isArray(parsed.watched) ? parsed.watched : [];
          const legacyDemoIds = new Set(shows.filter((show) => String(show.id).startsWith("demo-")).map((show) => show.id));
          if (legacyDemoIds.size) {
            shows = shows.filter((show) => !legacyDemoIds.has(show.id));
            watched = watched.filter((key) => !Array.from(legacyDemoIds).some((id) => key.startsWith(`${id}:`)));
          }
          if (storedVersion < 3) {
            const featured = featuredShows();
            const featuredById = new Map(featured.map((show) => [show.id, show]));
            shows = shows.map((show) => featuredById.get(show.id) || show);
            const existingIds = new Set(shows.map((show) => show.id));
            featured.forEach((show) => {
              if (!existingIds.has(show.id)) shows.push(show);
            });
            watched = watched.filter((key) => !Array.from(legacyDemoIds).some((id) => key.startsWith(`${id}:`)));
          }
          if (storedVersion < 4) {
            watched = Array.from(new Set([...watched, ...airedEpisodeKeys(shows)]));
          }
          const migrated = {
            version: DATA_VERSION,
            shows,
            watched: Array.isArray(parsed.watched) ? parsed.watched : [],
            reminders: Boolean(parsed.reminders)
          };
          migrated.watched = watched;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(migrated));
          return migrated;
        } catch (error) {
          return initialState();
        }
      }

      let state = loadState();
      let viewedMonth = new Date(today.getFullYear(), today.getMonth(), 1);
      let selectedDate = dateKey(today);

      const el = {
        todayEyebrow: document.getElementById("todayEyebrow"),
        heroSubtitle: document.getElementById("heroSubtitle"),
        showCount: document.getElementById("showCount"),
        weekCount: document.getElementById("weekCount"),
        watchedPercent: document.getElementById("watchedPercent"),
        monthTitle: document.getElementById("monthTitle"),
        calendarGrid: document.getElementById("calendarGrid"),
        prevMonth: document.getElementById("prevMonth"),
        nextMonth: document.getElementById("nextMonth"),
        todayBtn: document.getElementById("todayBtn"),
        agendaTitle: document.getElementById("agendaTitle"),
        agendaSubtitle: document.getElementById("agendaSubtitle"),
        agendaList: document.getElementById("agendaList"),
        watchAllBtn: document.getElementById("watchAllBtn"),
        nextList: document.getElementById("nextList"),
        showGrid: document.getElementById("showGrid"),
        reminderBtn: document.getElementById("reminderBtn"),
        reminderLabel: document.getElementById("reminderLabel"),
        exportBtn: document.getElementById("exportBtn"),
        themeBtn: document.getElementById("themeBtn"),
        themeIcon: document.getElementById("themeIcon"),
        addShowTop: document.getElementById("addShowTop"),
        addShowBottom: document.getElementById("addShowBottom"),
        dialog: document.getElementById("showDialog"),
        dialogTitle: document.getElementById("dialogTitle"),
        form: document.getElementById("showForm"),
        formError: document.getElementById("formError"),
        titleInput: document.getElementById("showTitleInput"),
        platformInput: document.getElementById("platformInput"),
        premiereInput: document.getElementById("premiereInput"),
        timeInput: document.getElementById("timeInput"),
        totalInput: document.getElementById("totalInput"),
        idInput: document.getElementById("showIdInput"),
        deleteBtn: document.getElementById("deleteShowBtn"),
        closeDialog: document.getElementById("closeDialog"),
        cancelDialog: document.getElementById("cancelDialog"),
        saveShowBtn: document.getElementById("saveShowBtn"),
        toastRegion: document.getElementById("toastRegion")
      };

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (error) {
          showToast("浏览器未能保存数据，请检查隐私设置。");
        }
      }

      function buildSchedule(show) {
        const episodes = [];
        if (!show || !show.premiere) return episodes;
        if (Array.isArray(show.fixedEpisodes) && show.fixedEpisodes.length) {
          return show.fixedEpisodes
            .filter((entry) => entry && entry.date)
            .map((entry, index) => ({
              key: `${show.id}:fixed:${index + 1}`,
              showId: show.id,
              show,
              date: entry.date,
              number: index + 1,
              label: entry.label || `第 ${index + 1} 期`,
              accessLabel: entry.accessLabel || "正片",
              platform: entry.platform || show.platform,
              time: entry.time || show.time
            }))
            .sort((a, b) => a.date.localeCompare(b.date));
        }
        const premiere = parseDate(show.premiere);
        if (Number.isNaN(premiere.getTime())) return episodes;
        let cursor = startOfDay(premiere);
        let episodeNumber = 1;
        const total = Math.max(1, Number(show.total) || 1);
        const updateDays = Array.isArray(show.days) ? show.days.map(Number) : [];
        let guard = 0;

        while (episodeNumber <= total && guard < 1800) {
          if (updateDays.includes(cursor.getDay())) {
            episodes.push({
              key: `${show.id}:${episodeNumber}`,
              showId: show.id,
              show,
              date: dateKey(cursor),
              number: episodeNumber
            });
            episodeNumber += 1;
          }
          cursor = addDays(cursor, 1);
          guard += 1;
        }
        return episodes;
      }

      function episodeLabel(episode) {
        return episode.label || `第 ${episode.number} 集`;
      }

      function allEpisodes() {
        return state.shows.flatMap(buildSchedule).sort((a, b) => {
          if (a.date === b.date) return (a.time || a.show.time).localeCompare(b.time || b.show.time);
          return a.date.localeCompare(b.date);
        });
      }

      function episodesOn(key) {
        return allEpisodes().filter((episode) => episode.date === key);
      }

      function watchedSet() {
        return new Set(state.watched);
      }

      function getStats() {
        const episodes = allEpisodes();
        const watched = watchedSet();
        const weekStart = startOfWeek(today);
        const weekEnd = addDays(weekStart, 7);
        const thisWeek = episodes.filter((episode) => {
          const date = parseDate(episode.date);
          return date >= weekStart && date < weekEnd;
        });
        const watchedCount = episodes.filter((episode) => watched.has(episode.key)).length;
        return {
          showCount: state.shows.length,
          weekCount: thisWeek.length,
          watchedCount,
          totalCount: episodes.length,
          percent: episodes.length ? Math.round((watchedCount / episodes.length) * 100) : 0
        };
      }

      function formatSelectedDate(key) {
        const date = parseDate(key);
        return `${date.getMonth() + 1}月${date.getDate()}日 · ${DAY_NAMES[date.getDay()]}`;
      }

      function renderHero() {
        const todayEpisodes = episodesOn(dateKey(today));
        const tomorrowEpisodes = episodesOn(dateKey(addDays(today, 1)));
        const stats = getStats();
        const fullDate = `${today.getFullYear()}年${today.getMonth() + 1}月${today.getDate()}日 · ${DAY_NAMES[today.getDay()]}`;
        el.todayEyebrow.textContent = fullDate;
        el.showCount.textContent = stats.showCount;
        el.weekCount.textContent = stats.weekCount;
        el.watchedPercent.textContent = `${stats.percent}%`;

        if (todayEpisodes.length) {
          el.heroSubtitle.textContent = `今天有 ${todayEpisodes.length} 集更新，最期待的那部别错过。`;
        } else if (tomorrowEpisodes.length) {
          el.heroSubtitle.textContent = `今天留白，明天有 ${tomorrowEpisodes.length} 集更新。`;
        } else {
          el.heroSubtitle.textContent = "今天没有更新，泡杯茶，重温一集也很好。";
        }
      }

      function renderCalendar() {
        const year = viewedMonth.getFullYear();
        const month = viewedMonth.getMonth();
        el.monthTitle.innerHTML = `${MONTH_NAMES[month]}<small>${year}</small>`;
        const first = new Date(year, month, 1);
        const mondayOffset = (first.getDay() + 6) % 7;
        const gridStart = addDays(first, -mondayOffset);
        const watched = watchedSet();
        const cells = [];

        for (let index = 0; index < 42; index += 1) {
          const cellDate = addDays(gridStart, index);
          const key = dateKey(cellDate);
          const episodes = episodesOn(key);
          const isOutside = cellDate.getMonth() !== month;
          const isToday = key === dateKey(today);
          const isSelected = key === selectedDate;
          const isWeekend = cellDate.getDay() === 0 || cellDate.getDay() === 6;
          const visibleEpisodes = episodes.slice(0, 2);
          const chips = visibleEpisodes.map((episode) => {
            const done = watched.has(episode.key) ? " · 已看" : "";
            return `<span class="episode-chip" style="--show-color:${escapeHtml(episode.show.color)}">${escapeHtml(episode.show.title)} ${escapeHtml(episodeLabel(episode))}${done}</span>`;
          }).join("");
          const extra = episodes.length > 2 ? `<span class="episode-chip more-chip">+${episodes.length - 2} 集更新</span>` : "";
          const dots = episodes.slice(0, 4).map((episode) => (
            `<span class="mobile-dot" style="--show-color:${escapeHtml(episode.show.color)}"></span>`
          )).join("");
          const label = `${cellDate.getMonth() + 1}月${cellDate.getDate()}日${episodes.length ? `，${episodes.length}集更新` : ""}`;
          const classes = ["day", isOutside ? "is-outside" : "", isToday ? "is-today" : "", isSelected ? "is-selected" : "", isWeekend ? "is-weekend" : ""].filter(Boolean).join(" ");

          cells.push(`
            <button class="${classes}" type="button" data-date="${key}" role="gridcell" aria-label="${label}" aria-selected="${isSelected}">
              <span class="day-number">${cellDate.getDate()}</span>
              <span class="episode-chips">${chips}${extra}</span>
              <span class="mobile-dots" aria-hidden="true">${dots}</span>
            </button>
          `);
        }
        el.calendarGrid.innerHTML = cells.join("");
      }

      function renderAgenda() {
        const episodes = episodesOn(selectedDate);
        const watched = watchedSet();
        el.agendaTitle.textContent = formatSelectedDate(selectedDate);
        el.agendaSubtitle.textContent = episodes.length ? `${episodes.length} 集更新` : "今天没有更新安排";
        el.watchAllBtn.hidden = !episodes.length || episodes.every((episode) => watched.has(episode.key));

        if (!episodes.length) {
          el.agendaList.innerHTML = `
            <div class="empty">
              <strong>给眼睛放个假</strong>
              这一天没有更新，去片单里添加一部新剧吧。
            </div>
          `;
          return;
        }

        el.agendaList.innerHTML = episodes.map((episode) => {
          const done = watched.has(episode.key);
          return `
            <article class="agenda-item${done ? " is-watched" : ""}" style="--show-color:${escapeHtml(episode.show.color)}">
              <div class="agenda-main">
                <div class="agenda-time">${escapeHtml(episode.time || episode.show.time)} · ${escapeHtml(episode.accessLabel || "正片")}</div>
                <div class="agenda-show">${escapeHtml(episode.show.title)}</div>
                <div class="agenda-meta">${escapeHtml(episodeLabel(episode))} · ${escapeHtml(episode.platform || episode.show.platform || "未填写平台")}</div>
              </div>
              <button class="watch-btn${done ? " is-watched" : ""}" type="button" data-watch="${episode.key}" aria-label="${done ? "标记为未看" : "标记为已看"}" aria-pressed="${done}">
                <svg aria-hidden="true"><use href="#icon-check"></use></svg>
              </button>
            </article>
          `;
        }).join("");
      }

      function renderNext() {
        const todayKey = dateKey(today);
        const watched = watchedSet();
        const upcoming = allEpisodes()
          .filter((episode) => episode.date >= todayKey && !watched.has(episode.key))
          .slice(0, 3);

        if (!upcoming.length) {
          el.nextList.innerHTML = `<div class="empty">片单已经追完，期待下一部。</div>`;
          return;
        }

        el.nextList.innerHTML = upcoming.map((episode) => {
          const date = parseDate(episode.date);
          return `
            <div class="next-row">
              <div class="next-date">
                <strong>${date.getDate()}</strong>
                <span>${date.getMonth() + 1}月</span>
              </div>
              <div class="next-copy">
                <div class="next-title">${escapeHtml(episode.show.title)}</div>
                <div class="next-meta">${escapeHtml(episodeLabel(episode))} · ${escapeHtml(episode.platform || episode.show.platform || "待更新")}</div>
              </div>
              <div class="next-time">${escapeHtml(episode.time || episode.show.time)}</div>
            </div>
          `;
        }).join("");
      }

      function renderLibrary() {
        const watched = watchedSet();
        const cards = state.shows.map((show) => {
          const episodes = buildSchedule(show);
          const watchedCount = episodes.filter((episode) => watched.has(episode.key)).length;
          const percent = episodes.length ? Math.round((watchedCount / episodes.length) * 100) : 0;
          const dayText = (show.days || []).map((day) => DAY_NAMES[Number(day)]).join("、");
          const scheduleText = show.scheduleNote || `${dayText} · ${show.time} 更新`;
          const progressUnit = Array.isArray(show.fixedEpisodes) ? "个已排日程" : "集";
          const firstChar = Array.from(show.title || "剧")[0];
          return `
            <article class="show-card" style="--show-color:${escapeHtml(show.color || COLORS[0])}">
              <div class="show-cover" aria-hidden="true"><span>${escapeHtml(firstChar)}</span></div>
              <div class="show-info">
                <div class="show-topline">
                  <span class="platform-dot"></span>
                  <span class="platform">${escapeHtml(show.platform || "未填写平台")}</span>
                </div>
                <h3 class="show-title" title="${escapeHtml(show.title)}">${escapeHtml(show.title)}</h3>
                <div class="show-schedule">${escapeHtml(scheduleText)}</div>
                <div class="show-progress">
                  <div class="progress-label">
                    <span>已看 ${watchedCount} / ${episodes.length} ${progressUnit}</span>
                    <span>${percent}%</span>
                  </div>
                  <div class="progress-track" role="progressbar" aria-label="${escapeHtml(show.title)}观看进度" aria-valuenow="${percent}" aria-valuemin="0" aria-valuemax="100">
                    <div class="progress-fill" style="width:${percent}%"></div>
                  </div>
                </div>
              </div>
              <button class="edit-show" type="button" data-edit="${escapeHtml(show.id)}" aria-label="编辑 ${escapeHtml(show.title)}">
                <svg aria-hidden="true"><use href="#icon-edit"></use></svg>
              </button>
            </article>
          `;
        }).join("");

        el.showGrid.innerHTML = `${cards}<button class="add-card" id="addCard" type="button"><svg aria-hidden="true"><use href="#icon-plus"></use></svg>再添加一部</button>`;
        document.getElementById("addCard").addEventListener("click", openAddDialog);
      }

      function renderReminderButton() {
        el.reminderBtn.setAttribute("aria-pressed", String(state.reminders));
        el.reminderLabel.textContent = state.reminders ? "提醒已开启" : "开启提醒";
        el.reminderBtn.setAttribute("aria-label", state.reminders ? "关闭提醒" : "开启提醒");
      }

      function renderAll() {
        renderHero();
        renderCalendar();
        renderAgenda();
        renderNext();
        renderLibrary();
        renderReminderButton();
      }

      function showToast(message, duration = 2800) {
        window.clearTimeout(toastTimer);
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.textContent = message;
        el.toastRegion.replaceChildren(toast);
        toastTimer = window.setTimeout(() => toast.remove(), duration);
      }

      function selectDate(key) {
        selectedDate = key;
        const date = parseDate(key);
        if (date.getMonth() !== viewedMonth.getMonth() || date.getFullYear() !== viewedMonth.getFullYear()) {
          viewedMonth = new Date(date.getFullYear(), date.getMonth(), 1);
        }
        renderCalendar();
        renderAgenda();
      }

      el.calendarGrid.addEventListener("click", (event) => {
        const day = event.target.closest("[data-date]");
        if (day) selectDate(day.dataset.date);
      });

      el.prevMonth.addEventListener("click", () => {
        viewedMonth = new Date(viewedMonth.getFullYear(), viewedMonth.getMonth() - 1, 1);
        renderCalendar();
      });

      el.nextMonth.addEventListener("click", () => {
        viewedMonth = new Date(viewedMonth.getFullYear(), viewedMonth.getMonth() + 1, 1);
        renderCalendar();
      });

      el.todayBtn.addEventListener("click", () => {
        viewedMonth = new Date(today.getFullYear(), today.getMonth(), 1);
        selectedDate = dateKey(today);
        renderCalendar();
        renderAgenda();
      });

      el.agendaList.addEventListener("click", (event) => {
        const button = event.target.closest("[data-watch]");
        if (!button) return;
        const key = button.dataset.watch;
        const set = watchedSet();
        if (set.has(key)) set.delete(key);
        else set.add(key);
        state.watched = Array.from(set);
        saveState();
        renderAll();
      });

      el.watchAllBtn.addEventListener("click", () => {
        const set = watchedSet();
        episodesOn(selectedDate).forEach((episode) => set.add(episode.key));
        state.watched = Array.from(set);
        saveState();
        renderAll();
        showToast("这一天的更新都标记为已看。");
      });

      el.showGrid.addEventListener("click", (event) => {
        const edit = event.target.closest("[data-edit]");
        if (edit) openEditDialog(edit.dataset.edit);
      });

      function defaultFormValues(show) {
        el.form.reset();
        el.formError.textContent = "";
        el.idInput.value = show?.id || "";
        el.titleInput.value = show?.title || "";
        el.platformInput.value = show?.platform || "";
        el.premiereInput.value = show?.premiere || dateKey(today);
        el.timeInput.value = show?.time || "20:00";
        el.totalInput.value = show?.total || 12;
        const days = show?.days || [today.getDay()];
        el.form.querySelectorAll('input[name="days"]').forEach((input) => {
          input.checked = days.map(Number).includes(Number(input.value));
        });
        const color = show?.color || COLORS[0];
        const radios = Array.from(el.form.querySelectorAll('input[name="color"]'));
        const match = radios.find((radio) => radio.value === color);
        if (match) match.checked = true;
        el.dialogTitle.textContent = show ? "编辑追剧设置" : "添加一部剧";
        el.deleteBtn.hidden = !show;
        el.saveShowBtn.textContent = show ? "保存修改" : "保存到片单";
        el.dialog.showModal();
        window.setTimeout(() => el.titleInput.focus(), 30);
      }

      function openAddDialog() {
        defaultFormValues(null);
      }

      function openEditDialog(id) {
        const show = state.shows.find((item) => item.id === id);
        if (show) defaultFormValues(show);
      }

      function closeDialog() {
        el.dialog.close();
      }

      el.addShowTop.addEventListener("click", openAddDialog);
      el.addShowBottom.addEventListener("click", openAddDialog);
      el.closeDialog.addEventListener("click", closeDialog);
      el.cancelDialog.addEventListener("click", closeDialog);
      el.dialog.addEventListener("click", (event) => {
        const rect = el.dialog.getBoundingClientRect();
        const inside = event.clientX >= rect.left && event.clientX <= rect.right && event.clientY >= rect.top && event.clientY <= rect.bottom;
        if (!inside) closeDialog();
      });

      el.form.addEventListener("submit", (event) => {
        event.preventDefault();
        const title = el.titleInput.value.trim();
        const premiere = el.premiereInput.value;
        const total = Number(el.totalInput.value);
        const selectedDays = Array.from(el.form.querySelectorAll('input[name="days"]:checked')).map((input) => Number(input.value));
        const color = el.form.querySelector('input[name="color"]:checked')?.value || COLORS[0];
        const platform = el.platformInput.value.trim();
        const time = el.timeInput.value || "20:00";
        const existingId = el.idInput.value;

        if (!title) {
          el.formError.textContent = "请填写剧名。";
          el.titleInput.focus();
          return;
        }
        if (!premiere) {
          el.formError.textContent = "请选择首播日期。";
          el.premiereInput.focus();
          return;
        }
        if (!Number.isInteger(total) || total < 1 || total > 200) {
          el.formError.textContent = "总集数需在 1 到 200 之间。";
          el.totalInput.focus();
          return;
        }
        if (!selectedDays.length) {
          el.formError.textContent = "请至少选择一个每周更新日。";
          return;
        }

        if (existingId) {
          const index = state.shows.findIndex((show) => show.id === existingId);
          if (index >= 0) {
            state.shows[index] = { ...state.shows[index], title, platform, premiere, time, total, days: selectedDays, color };
          }
        } else {
          state.shows.push({
            id: `show-${Date.now()}`,
            title,
            platform,
            premiere,
            time,
            total,
            days: selectedDays,
            color
          });
        }
        saveState();
        closeDialog();
        renderAll();
        showToast(existingId ? "追剧设置已更新。" : `《${title}》已加入片单。`);
      });

      el.deleteBtn.addEventListener("click", () => {
        const id = el.idInput.value;
        const show = state.shows.find((item) => item.id === id);
        if (!show) return;
        if (!window.confirm(`确定从片单中删除《${show.title}》吗？观看记录也会一并移除。`)) return;
        state.shows = state.shows.filter((item) => item.id !== id);
        const prefix = `${id}:`;
        state.watched = state.watched.filter((key) => !key.startsWith(prefix));
        saveState();
        closeDialog();
        renderAll();
        showToast("已从片单中删除。");
      });

      el.reminderBtn.addEventListener("click", async () => {
        if (state.reminders) {
          state.reminders = false;
          saveState();
          renderReminderButton();
          showToast("提醒已关闭。");
          return;
        }

        let permission = "denied";
        if ("Notification" in window) {
          try {
            permission = await Notification.requestPermission();
          } catch (error) {
            permission = Notification.permission;
          }
        }
        state.reminders = true;
        saveState();
        renderReminderButton();
        if (permission === "granted") {
          showToast("提醒已开启，到更新时间会通知你。");
        } else {
          showToast("页面内提醒已开启；浏览器通知需要你手动允许。", 3800);
        }
      });

      function checkReminders() {
        if (!state.reminders) return;
        const now = new Date();
        const nowKey = dateKey(now);
        const nowMinutes = now.getHours() * 60 + now.getMinutes();
        episodesOn(nowKey).forEach((episode) => {
          const [hours, minutes] = (episode.time || episode.show.time).split(":").map(Number);
          const showMinutes = hours * 60 + minutes;
          if (nowMinutes >= showMinutes && nowMinutes <= showMinutes + 1 && !reminderSent.has(episode.key)) {
            reminderSent.add(episode.key);
            const message = `《${episode.show.title}》${episodeLabel(episode)}（${episode.accessLabel || "正片"}）开始更新了`;
            showToast(message, 6000);
            if ("Notification" in window && Notification.permission === "granted") {
              new Notification("追光日历提醒", { body: message, tag: episode.key });
            }
          }
        });
      }

      function escapeIcs(value) {
        return String(value).replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;");
      }

      function icsDateTime(episode) {
        const [hours, minutes] = (episode.time || episode.show.time).split(":");
        return `${episode.date.replace(/-/g, "")}T${hours}${minutes}00`;
      }

      function exportCalendar() {
        const upcoming = allEpisodes().filter((episode) => episode.date >= dateKey(today));
        if (!upcoming.length) {
          showToast("暂时没有可以导出的更新。");
          return;
        }
        const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}Z$/, "Z");
        const events = upcoming.map((episode) => {
          const start = icsDateTime(episode);
          const date = parseDate(episode.date);
          const eventTime = (episode.time || episode.show.time).split(":");
          const endDate = new Date(date.getFullYear(), date.getMonth(), date.getDate(), Number(eventTime[0]) + 1, Number(eventTime[1]));
          const end = `${dateKey(endDate).replace(/-/g, "")}T${pad(endDate.getHours())}${pad(endDate.getMinutes())}00`;
          return [
            "BEGIN:VEVENT",
            `UID:${episode.key.replace(/[^a-zA-Z0-9-]/g, "-")}@zhuiguang.local`,
            `DTSTAMP:${stamp}`,
            `DTSTART:${start}`,
            `DTEND:${end}`,
            `SUMMARY:${escapeIcs(`${episode.show.title} ${episodeLabel(episode)}`)}`,
            `DESCRIPTION:${escapeIcs(`${episode.accessLabel || "正片"} · ${episode.platform || episode.show.platform || "追剧"} · 来自追光日历`)}`,
            "BEGIN:VALARM",
            "TRIGGER:-PT15M",
            "ACTION:DISPLAY",
            `DESCRIPTION:${escapeIcs(`${episode.show.title} 即将更新`)}`,
            "END:VALARM",
            "END:VEVENT"
          ].join("\r\n");
        });
        const content = [
          "BEGIN:VCALENDAR",
          "VERSION:2.0",
          "PRODID:-//Zhuiguang Calendar//CN",
          "CALSCALE:GREGORIAN",
          "METHOD:PUBLISH",
          ...events,
          "END:VCALENDAR"
        ].join("\r\n");
        const blob = new Blob(["\ufeff", content], { type: "text/calendar;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = `追光日历-${dateKey(today)}.ics`;
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
        URL.revokeObjectURL(url);
        showToast(`已导出 ${upcoming.length} 个更新日程。`);
      }

      el.exportBtn.addEventListener("click", exportCalendar);

      function setTheme(theme) {
        document.documentElement.dataset.theme = theme;
        el.themeIcon.setAttribute("href", theme === "dark" ? "#icon-sun" : "#icon-moon");
        el.themeBtn.setAttribute("aria-label", theme === "dark" ? "切换浅色模式" : "切换深色模式");
        document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "dark" ? "#121716" : "#f6f2e9");
        try {
          localStorage.setItem(THEME_KEY, theme);
        } catch (error) {
          // Theme still works for this session if storage is unavailable.
        }
      }

      el.themeBtn.addEventListener("click", () => {
        setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
      });

      let initialTheme = "light";
      try {
        initialTheme = localStorage.getItem(THEME_KEY) || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch (error) {
        initialTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      setTheme(initialTheme);
      renderAll();
      checkReminders();
      window.setInterval(checkReminders, 30000);
    })();
  </script>
</body>
</html>
